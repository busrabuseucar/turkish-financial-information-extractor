[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-financial-information-extractor"
version = "0.3.0"
description = "Evidence-linked rule-based extraction from Turkish financial texts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Büşra Buse Uçar"}]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
demo = ["streamlit>=1.49,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
turfinextract = "turfinextract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
